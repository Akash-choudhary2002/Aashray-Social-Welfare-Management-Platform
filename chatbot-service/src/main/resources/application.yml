server:
  port: 8087

spring:
  application:
    name: CHATBOT-SERVICE

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET:aashray-super-secret-key-change-me-in-production-min-256-bits}

# Gemini is the preferred AI provider (per project spec: Gemini/OpenAI API).
# Leave GEMINI_API_KEY unset to run the chatbot in FAQ-fallback mode with
# zero external setup — see FaqFallbackService / README.
gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  connect-timeout-ms: ${GEMINI_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${GEMINI_READ_TIMEOUT_MS:15000}
  temperature: ${GEMINI_TEMPERATURE:0.4}
  max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:512}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [${spring.application.name}] %-5level %logger{36} - %msg%n"
  level:
    com.aashray.chatbot: INFO
