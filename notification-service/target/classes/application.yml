server:
  port: 8084

spring:
  application:
    name: NOTIFICATION-SERVICE

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:aashray_notification_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 2000
    listener:
      simple:
        # RabbitMQ is intentionally not running for local verification.
        # Without this, the @RabbitListener containers (UserRegisteredListener,
        # FoodDonationEventListener, etc.) would try to connect on startup and
        # log continuous reconnect-retry noise. Flip back to true (or delete
        # this line) once RabbitMQ is actually running.
        auto-startup: ${RABBITMQ_LISTENERS_ENABLED:false}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: false
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET:aashray-super-secret-key-change-me-in-production-min-256-bits}

# When false (default, no SMTP credentials required), emails are logged and
# persisted to notification_logs with status SIMULATED instead of being
# actually dispatched — lets the whole platform run end-to-end without a
# real mailbox. Set EMAIL_ENABLED=true and provide MAIL_USERNAME/MAIL_PASSWORD
# (a Gmail App Password, for example) to send real emails.
notification:
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@aashray.org}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [${spring.application.name}] %-5level %logger{36} - %msg%n"
  level:
    com.aashray.notification: INFO
